name: Quality Gate

on:
  pull_request:
  push:
    paths:
      - "engine/**"
      - "pcb-registry/**"
      - "web-app/**"
      - "scenarios/**"
      - "tools/**"
      - "assets/boards/**"
      - "github/workflows/**"

jobs:
  rust-and-scenarios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Engine tests
        run: cargo test --manifest-path engine/Cargo.toml

      - name: PCB registry tests
        run: cargo test --manifest-path pcb-registry/Cargo.toml

      - name: Scenario validation (all)
        run: cargo run --quiet --manifest-path tools/scenario_cli/Cargo.toml -- validate-all scenarios

  web-and-board-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install web dependencies
        run: npm -C web-app ci

      - name: Validate board metadata
        run: node tools/validate-board.mjs

      - name: Build web app
        run: npm -C web-app run build
