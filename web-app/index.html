<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HP Repair Simulator v2.0</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>

<body>
  <header class="topbar">
    <h1>HP Repair Simulator</h1>
    <div id="boardProfileLabel" class="badge">
      No Board Loaded
    </div>
  </header>

  <div class="layout">
    <section class="main">
      <div id="motherboardMap" class="motherboardMap"></div>

      <div class="panel">
        <strong>Live Telemetry</strong>

        <div class="telemetryGrid">
          <div>
            <small>Voltage History</small>
            <canvas id="voltageCanvas" class="telemetryCanvas"></canvas>
          </div>
          <div>
            <small>Thermal History</small>
            <canvas id="thermalCanvas" class="telemetryCanvas"></canvas>
          </div>
        </div>

        <div class="distressBlock">
          <small>System Distress Level</small>
          <div class="distressBar">
            <canvas id="distressCanvas" class="distressCanvas"></canvas>
            <div id="distressFill" class="distressFill"></div>
          </div>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="panel">
        <strong>Simulation Control</strong>

        <div class="btnRow">
          <button id="stepBtn">STEP</button>
          <button id="run" class="btnRun">RUN</button>
          <button id="pause">PAUSE</button>
          <button id="btn-reset" class="btnReset">RESET</button>
        </div>

        <div class="rowBetween">
          <select id="speed" class="selectDark">
            <option value="1" selected>Speed: 1x</option>
            <option value="2">Speed: 2x</option>
            <option value="5">Speed: 5x</option>
          </select>
          <span id="status" class="statusStopped">STOPPED</span>
        </div>
      </div>

      <div class="panel">
        <strong>DC Power Supply</strong>

        <div class="grid2">
          <label>V:
            <input type="number" id="psuVoltage" value="4.2" step="0.1" class="inputDark smallInput">
          </label>
          <label>Limit:
            <input type="number" id="psuCurrentLimit" value="2.0" step="0.1" class="inputDark smallInput">
          </label>
        </div>

        <div class="rowBetween">
          <label><input type="checkbox" id="psuEnable" checked> Enable</label>
          <button id="psuApply" class="btnPrimary">Set</button>
        </div>

        <div id="psuStatus" class="mono accent">PSU: OFF</div>
        <div id="psuMeasuredCurrent" class="mono">Current: 0.000 A</div>
      </div>

      <div class="panel">
        <strong>Multimeter</strong>

        <select id="multimeterMode" class="selectDark fullWidth">
          <option value="voltage">DC Voltage (V)</option>
          <option value="diode">Diode Mode</option>
          <option value="resistance">Resistance (Ω)</option>
        </select>

        <div class="mmRow">
          <select id="multimeterTargetType" class="selectDark">
            <option value="rail">Rail</option>
            <option value="component">Component</option>
          </select>
          <select id="multimeterComponent" class="selectDark flex1" disabled>
            <option>Select Component</option>
          </select>
          <input type="text" id="multimeterRail" placeholder="Rail" value="vbat" class="inputDark railInput">
        </div>

        <button id="manualMeasure" class="btnPrimary fullWidth">MEASURE</button>

        <div class="meterReadout">
          <span class="meterLabel">READING</span>
          <strong id="multimeterResult" class="meterValue">0.00</strong>
        </div>
      </div>
    </aside>
  </div>

  <footer class="footerGrid">
    <div class="panel">
      <h3>Diagnostic Intelligence</h3>
      <div id="diagnosticText" class="accent"></div>
      <div id="diagnosticConfidence" class="muted small"></div>
      <ul id="hypothesisList" class="hypothesis"></ul>
      <button id="exportReport" class="btnGhost">Export Report</button>
    </div>

    <div class="panel">
      <small>Engine Real-time Snapshot</small>
      <pre id="output" class="preBox">System Ready…</pre>
    </div>
  </footer>

  <div style="display:none;">
    <input type="range" id="smoothingSlider" min="0" max="1" step="0.01">
    <span id="smoothingValue"></span>
    <input type="range" id="timelineScrubber" min="0" max="100">
    <select id="scenarioSelect"><option value="Default">Default</option></select>
    <div id="scenarioName"></div>
    <div id="simTime"></div>
    <div id="railTogglePanel"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
